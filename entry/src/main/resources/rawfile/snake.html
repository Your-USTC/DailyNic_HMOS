<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
  }
<!--  h1 { font-size: 22px; letter-spacing: 4px; color: #0f9; }-->
  #info { font-size: 15px; color: #aaa; }
  #info b { color: #0f9; font-size: 18px; }
  canvas {
    background: #16213e;
    border: 2px solid #0f9;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(0,255,153,.3);
    max-width: 100%;
  }
  #tip { font-size: 12px; color: #666; }
  #dpad {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    margin-top: 6px;
  }
  #dpad button {
    background: #16213e;
    color: #0f9;
    border: 1px solid #0f9;
    border-radius: 10px;
    font-size: 24px;
    touch-action: manipulation;
  }
  #dpad button:active { background: #0f9; color: #16213e; }
  @media (pointer: coarse) {
    #dpad { display: grid; }
    #tip { display: none; }
  }
</style>
</head>
<body>
<!--<h1>贪 吃 蛇</h1>-->
<div id="info">得分 <b id="score">0</b>　最高分 <b id="best">0</b></div>
<canvas id="game" width="400" height="400"></canvas>
<div id="dpad">
  <span></span><button data-dir="up">↑</button><span></span>
  <button data-dir="left">←</button><span></span><button data-dir="right">→</button>
  <span></span><button data-dir="down">↓</button><span></span>
</div>
<div id="tip">方向键 / WASD 移动，空格暂停</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, speed, timer, paused, dead;
let best = Number(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speed = 150;
  paused = false;
  dead = false;
  placeFood();
  document.getElementById('score').textContent = 0;
  schedule();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function schedule() {
  clearTimeout(timer);
  timer = setInterval(tick, speed);
}

function tick() {
  if (paused || dead) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (speed > 60) {
      speed -= 4;
      schedule();
    }
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  dead = true;
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    document.getElementById('best').textContent = best;
  }
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#eee';
  ctx.font = '16px sans-serif';
  const restartTip = ('ontouchstart' in window) ? '点击此处重新开始' : '按回车键重新开始';
  ctx.fillText(restartTip, canvas.width / 2, canvas.height / 2 + 24);
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#f55';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#0fa' : `rgba(0,255,153,${1 - t * 0.7})`;
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  });

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
  }
}

function setDir(nx, ny) {
  if ((nx !== 0 && dir.x === 0) || (ny !== 0 && dir.y === 0)) nextDir = {x: nx, y: ny};
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
  else if (k === ' ') {
    if (!dead) { paused = !paused; draw(); }
    e.preventDefault();
  } else if (k === 'enter' && dead) {
    reset();
  }
});

// 触屏滑动
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
    // 轻点：未结束 = 暂停，已结束 = 重新开始
    if (dead) reset();
    else { paused = !paused; draw(); }
  } else if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 1 : -1, 0);
  } else {
    setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
}, {passive: false});

// 虚拟方向键
document.querySelectorAll('#dpad button').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]}[btn.dataset.dir];
    setDir(d[0], d[1]);
  });
});

reset();
</script>
</body>
</html>
